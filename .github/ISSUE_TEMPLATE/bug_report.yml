name: Bug report
description: A wrong result, a crash or misleading output
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you got and what you expected. For a wrong number, say how you derived the expected value.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: Robot config (TOML), plus the command line, Python snippet or tick CSV rows.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `mecanum --version`, or the commit hash.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Python version and OS
  - type: dropdown
    id: hardware
    attributes:
      label: Where was this observed?
      options:
        - Library or CLI only (no robot)
        - Simulation
        - Real robot
    validations:
      required: true
