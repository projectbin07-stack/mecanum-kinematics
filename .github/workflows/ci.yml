name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Type check
        run: mypy

      - name: Test
        run: pytest --cov --cov-report=term-missing --cov-fail-under=85

      - name: Byte-compile the ROS 2 example (not executed, no ROS here)
        run: python -m py_compile examples/ros2/mecanum_node.py

      - name: CLI smoke test
        run: |
          mecanum --version
          mecanum ik --vx 0.5 --vy 0.2 --wz 1.0
          mecanum simulate --trajectory square --plot out.svg
          mecanum odom tests/data/ticks_delta.csv

      - name: Test optional matplotlib plots
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: |
          python -m pip install -e ".[plot]"
          python -c "import matplotlib; print(matplotlib.__version__)"
          pytest tests/test_plotting.py -rs

  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build
        run: |
          python -m pip install build
          python -m build
      - name: Install the wheel into a clean environment and run it
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install dist/*.whl
          cd /tmp
          /tmp/wheel-env/bin/mecanum configs
          /tmp/wheel-env/bin/mecanum simulate --trajectory circle --plot /tmp/circle.svg
